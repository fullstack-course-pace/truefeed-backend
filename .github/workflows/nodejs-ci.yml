name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Create .env from repository secrets
        env:
          PORT: ${{ secrets.PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_URI: ${{ secrets.ADMIN_URI }}
          EDITOR_URI: ${{ secrets.EDITOR_URI }}
          READER_URI: ${{ secrets.READER_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "PORT=$PORT" > .env
          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "ADMIN_URI=$ADMIN_URI" >> .env
          echo "EDITOR_URI=$EDITOR_URI" >> .env
          echo "READER_URI=$READER_URI" >> .env
          echo "DB_NAME=$DB_NAME" >> .env
          echo "FRONTEND_ORIGIN=$FRONTEND_ORIGIN" >> .env
          echo "NODE_ENV=$NODE_ENV" >> .env
          echo "SESSION_SECRET=$SESSION_SECRET" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (uses .env at runtime)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: truefeed-backend:ci

      - name: Docker run example (no-op, shows how to pass .env)
        run: |
          echo "To run the container with secrets from the repository, use:"
          echo "docker run --rm --env-file .env -p 5000:5000 truefeed-backend:ci"
