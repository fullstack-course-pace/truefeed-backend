name: Node.js CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # NOTE: Docker image build & push moved to a separate job (`docker`) so
      # the matrix testing job runs across Node versions and the image is pushed
      # only once after tests pass.

  # Docker build and push (runs only on main when tests pass)
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from secret
        if: ${{ github.secrets.BACKEND_ENV != '' }}
        run: |
          echo "Creating .env from BACKEND_ENV secret"
          echo "${{ secrets.BACKEND_ENV }}" > .env
        shell: bash

      # - name: Create .env from repository secrets
      #   env:
      #     PORT: ${{ secrets.PORT }}
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #     ADMIN_URI: ${{ secrets.ADMIN_URI }}
      #     EDITOR_URI: ${{ secrets.EDITOR_URI }}
      #     READER_URI: ${{ secrets.READER_URI }}
      #     DB_NAME: ${{ secrets.DB_NAME }}
      #     FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      #     NODE_ENV: ${{ secrets.NODE_ENV }}
      #     SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      #     JWT_SECRET: ${{ secrets.JWT_SECRET }}
      #   run: |
      #     echo "PORT=$PORT" > .env
      #     echo "DATABASE_URL=$DATABASE_URL" >> .env
      #     echo "ADMIN_URI=$ADMIN_URI" >> .env
      #     echo "EDITOR_URI=$EDITOR_URI" >> .env
      #     echo "READER_URI=$READER_URI" >> .env
      #     echo "DB_NAME=$DB_NAME" >> .env
      #     echo "FRONTEND_ORIGIN=$FRONTEND_ORIGIN" >> .env
      #     echo "NODE_ENV=$NODE_ENV" >> .env
      #     echo "SESSION_SECRET=$SESSION_SECRET" >> .env
      #     echo "JWT_SECRET=$JWT_SECRET" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
